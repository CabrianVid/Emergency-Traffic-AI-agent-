[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rescueflow"
version = "0.1.0"
description = "RescueFlow AI -- AdaHack 2026 disruption-aware transport replanning demonstration"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "click>=8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rescueflow = "rescueflow.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
